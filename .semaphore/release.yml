version: v1.0
name: release
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: release
    task:
      secrets:
        - name: rubygems-deploy
      jobs:
        - name: gem push
          commands:
            - checkout --use-cache
            - sem-version ruby $(cat .ruby-version) -f
            - VERSION=$(ruby -e "puts Gem::Specification.load('rspec-core-parallel.gemspec').version")
            - test "$VERSION" = "$SEMAPHORE_GIT_TAG_NAME"
            - gem build rspec-core-parallel.gemspec
            - gem push rspec-core-parallel-$VERSION.gem
